name: Publish to PyPI

# Publishes the package when a GitHub Release is published.
# Uses PyPI Trusted Publishing (no token stored in the repo):
# one-time setup at https://pypi.org/manage/account/publishing/ —
# add this repo, workflow "publish.yml", environment "pypi".
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
